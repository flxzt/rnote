[workspace]
members = [
    "crates/rnote-compose",
    "crates/rnote-engine",
    "crates/rnote-cli",
    "crates/rnote-ui",
]
resolver = "2"

[workspace.package]
authors = ["The Rnote Authors"]
edition = "2024"
homepage = "https://rnote.flxzt.net"
license = "GPL-3.0-or-later"
repository = "https://github.com/flxzt/rnote"
rust-version = "1.89"
version = "0.15.0"

[workspace.dependencies]
rnote-compose = { version = "0.15.0", path = "crates/rnote-compose" }
rnote-engine = { version = "0.15.0", path = "crates/rnote-engine" }

adw = { version = "0.9.2", package = "libadwaita", features = ["v1_7"] }
anyhow = "1.0"
approx = "0.5.1"
async-fs = "2.2"
base64 = "0.23.1"
blocking = "1.7"
cairo-rs = { version = "0.22.9", features = ["v1_18", "png", "svg", "pdf"] }
chrono = "0.4.45"
clap = { version = "4.6", features = ["derive"] }
dialoguer = "0.12.0"
flate2 = "1.1"
fs_extra = "1.3"
futures = "0.3.34"
geo = "0.33.1"
gettext-rs = { version = "0.8.0", features = ["gettext-system"] }
gio = "0.22.10"
glib = "0.22.10"
glib-build-tools = "0.22.8"
gtk4 = { version = "0.11.5", features = ["v4_18"] }
hayro = "0.8.0"
hayro-svg = "0.8.0"
ijson = "0.1.7"
image = { version = "0.25.10", default-features = false, features = [
    "rayon",
    "png",
    "bmp",
    "gif",
    "ico",
    "jpeg",
    "png",
    "tiff",
] }
indicatif = "0.18.6"
ink-stroke-modeler-rs = "0.1.0"
itertools = "0.15.0"
kurbo = "0.13.1"
librsvg = "=2.63"
notify-debouncer-full = "0.7.0"
num-derive = "0.5.1"
num-traits = "0.2.19"
numeric-sort = "0.1.5"
once_cell = "1.21"
open = "5.4"
palette = "0.7.7"
parry2d-f64 = { version = "0.31.1", features = ["serde-serialize"] }
path-absolutize = "4.0"
piet = "0.8.0"
piet-cairo = "0.8.0"
rand = "0.10.3"
rand_distr = "0.6.0"
rand_pcg = "0.10.2"
rayon = "1.12"
regex = "1.13"
rodio = { version = "0.22.2", default-features = false, features = [
    "playback",
    "wav",
] }
rough_piet = "0.15.0"
roughr = "0.14.0"
roxmltree = "0.21.1"
rstar = "0.13.0"
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
slotmap = { version = "1.1", features = ["serde"] }
smol = "2.0"
svg = "0.18.0"
tempfile = "3.27"
thiserror = "2.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-segmentation = "1.13"
url = "2.5"
usvg = "0.48.1"
winresource = "0.1.31"
xmlwriter = "0.1.0"

[patch.crates-io]
piet = { git = "https://github.com/linebender/piet", rev = "22210f03b8a2b203e2ad5ba9b600ed17f4a9407a" }
piet-cairo = { git = "https://github.com/linebender/piet", rev = "22210f03b8a2b203e2ad5ba9b600ed17f4a9407a" }

[profile.dev]
debug = true
opt-level = 2

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
# We want to be able to debug in the release build as well
debug = true
